<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>Fieldwork — Autonomous Research</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><div id="app"></div><div id="toast" role="status"></div><dialog id="research-dialog"><form id="research-form"><div class="modal-heading"><div><span class="eyebrow">A NEW LINE OF INQUIRY</span><h2>What would you like to explore?</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Close">×</button></div><label>Research question<textarea name="question" required minlength="10" maxlength="2000" placeholder="e.g. How is AI changing scientific discovery?" rows="3"></textarea></label><label>Focus & context <span class="muted">optional</span><input name="focus" placeholder="Audience, time period, or specific angles to investigate"></label><div class="form-grid"><label>Research depth<select name="depth"><option value="standard">Standard · up to 6 sources</option><option value="deep">In-depth · up to 10 sources</option></select></label><label>Source discovery<select name="discovery"><option value="yes">Search the web & scholarly abstracts</option><option value="no">Use only my sources</option></select></label></div><details id="source-details"><summary>Add your own evidence <span>URL or text excerpt</span></summary><label>Source title<input name="sourceTitle" placeholder="Name of the article or document"></label><label>Public source URL<input name="sourceUrl" type="url" placeholder="https://..."></label><label>Source excerpt<textarea name="sourceText" rows="4" placeholder="Paste at least 50 characters. Leave blank to retrieve the URL."></textarea></label><p class="form-note">Web retrieval supports HTML and text. For PDFs, paste a relevant excerpt. Pasted text is marked as user-provided.</p></details><p id="form-error" role="alert"></p><div class="modal-footer"><span>Findings stay connected to their evidence.</span><button class="primary" type="submit" id="submit-research">Begin research <span>↗</span></button></div></form></dialog></body></html>
